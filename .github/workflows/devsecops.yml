name: DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Default permissions
permissions:
  contents: read

jobs:
  # =========================================================
  # 1. DEPENDENCY SECURITY SCAN - NPM AUDIT
  # =========================================================
  dependency-security:
    name: Dependency Security - npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

  # =========================================================
  # 2. ESLINT SECURITY SCAN
  # =========================================================
  eslint-security:
    name: ESLint Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint security scan
        run: npm run security:lint

  # =========================================================
  # 3. SECRET SCANNING - GITLEAKS
  # =========================================================
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================
  # 4. CODEQL STATIC APPLICATION SECURITY TESTING
  # =========================================================
  codeql:
    name: CodeQL SAST Scan
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      packages: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4

  # =========================================================
  # 5. DEPLOY TO EC2
  # =========================================================
  deploy:
    name: Deploy Backend to EC2

    # Deployment starts only after ALL security jobs pass
    needs:
      - dependency-security
      - eslint-security
      - secret-scan
      - codeql

    # Deploy only when code is pushed to main
    # Pull requests will run security scans but will NOT deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: self-hosted

    steps:
      - name: Deploy approved commit to EC2
        run: |
          cd /home/ubuntu/ec2

          echo "========================================="
          echo "Starting secure deployment"
          echo "Approved commit: $GITHUB_SHA"
          echo "========================================="

          echo "Fetching latest repository data..."
          git fetch origin main

          echo "Deploying exact commit that passed security checks..."
          git reset --hard "$GITHUB_SHA"

          echo "Building Docker containers..."
          docker compose up -d --build --remove-orphans

          echo "Checking running containers..."
          docker compose ps

          echo "Removing unused Docker images..."
          docker image prune -f

          echo "========================================="
          echo "Deployment completed successfully"
          echo "Deployed commit:"
          git rev-parse HEAD
          echo "========================================="
